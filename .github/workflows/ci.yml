# Release gate that needs no secret and no live service: no Groq key (AI_PROVIDER=none), no Quranpedia request (the server reads the
# committed 36-verse test excerpt, and api.quranpedia.net / api.groq.com are pointed at 127.0.0.1 so any attempt fails loudly).
# Browser suites that need the whole Quran text (the a11y pass, suggestion, phrase, Uthmani and several decision suites) are run
# locally before each release (docs/PILOT.md «Release gate»); this workflow does not replace them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_PROVIDER: none
  PYTHONUTF8: "1"

jobs:
  python:
    name: Python tests (pytest, ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Block live services
        run: echo "127.0.0.1 api.quranpedia.net quranpedia.net api.groq.com generativelanguage.googleapis.com" | sudo tee -a /etc/hosts
      - run: pip install -r requirements-dev.txt
      - name: pytest (includes the Node tests of the revision engine)
        run: python -m pytest -q

  node:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/*.test.mjs

  browser:
    name: Browser gate (Chromium 1366/390/320 px; import also in Firefox and WebKit; test excerpt)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QURAN_CACHE_DIR: ${{ github.workspace }}/.ci-quran-cache
      SOURCE_TIMEOUT_SECONDS: "3"
      NODE_PATH: ${{ github.workspace }}/.ci-node/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Block live services
        run: echo "127.0.0.1 api.quranpedia.net quranpedia.net api.groq.com generativelanguage.googleapis.com" | sudo tee -a /etc/hosts
      - run: pip install -r requirements.txt
      - name: Playwright (outside the project; not a dependency of the app)
        run: |
          mkdir -p .ci-node && cd .ci-node
          echo '{"name": "ci-browser-tools", "private": true}' > package.json
          npm install --no-audit --no-fund playwright@1.63.0 axe-core@4.13.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Quran text = the 36-verse test excerpt
        run: python scripts/ci_fixture_cache.py
      - name: Reduced-mode server starts without secrets and answers from the excerpt
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:8000/api/health > /dev/null && break; sleep 0.3; done
          curl -sf "http://127.0.0.1:8000/api/health?deep=1" | python -c "import json,sys; h=json.load(sys.stdin); s=h['source']; print(h['mode'], s); assert h['mode']=='reduced' and not h['ai_configured'] and s['loaded_from']=='disk' and s['ayahs']==36 and s['last_error'] is None"
          python scripts/e2e_check.py http://127.0.0.1:8000 --excerpt
          kill $SERVER
      - name: Browser suites
        run: |
          set -o pipefail
          fail=0
          for s in ui_pilot_journey_e2e ui_journey_e2e ui_e2e ui_counts_e2e ui_dock_e2e ui_feedback_e2e ui_model_notices_e2e ui_long_e2e ui_selfhost_e2e ui_workspace_e2e ui_import_e2e; do
            echo "::group::$s"
            if node scripts/$s.mjs --shots shots/$s > logs-$s.txt 2>&1; then r=ok; else r=FAILED; fail=1; fi
            grep -E "^(FAIL|INFO)" logs-$s.txt || true
            echo "$s: $r, $(grep -c '^PASS' logs-$s.txt) passed, $(grep -c '^FAIL' logs-$s.txt) failed" | tee -a summary.txt
            echo "::endgroup::"
          done
          for b in firefox webkit; do
            echo "::group::ui_import_e2e ($b)"
            if node scripts/ui_import_e2e.mjs --browser $b > logs-import-$b.txt 2>&1; then r=ok; else r=FAILED; fail=1; fi
            grep -E "^FAIL" logs-import-$b.txt || true
            echo "ui_import_e2e ($b): $r, $(grep -c '^PASS' logs-import-$b.txt) passed, $(grep -c '^FAIL' logs-import-$b.txt) failed" | tee -a summary.txt
            echo "::endgroup::"
          done
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit $fail
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-logs
          path: |
            logs-*.txt
            server.log
            shots/
          retention-days: 7
